name: Idea
description: Something the app could do better.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Some lines don't move: no network, no accounts, no analytics, no ads, and no
        diagnosis. Ideas that need one of those will be closed, kindly.
  - type: textarea
    id: moment
    attributes:
      label: The moment
      description: Where were you, what were you trying to do, and what got in the way?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
